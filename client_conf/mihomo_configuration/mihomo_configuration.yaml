proxy-providers:
  AirPort_01:
    type: http
    interval: 1440
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    url: "Your Subscription's URL."
  AirPort_02:
    type: http
    interval: 1440
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    url: "Your Subscription's URL."

geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
  asn: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"
unified-delay: true
geodata-mode: false
geo-auto-update: true
geo-update-interval: 24
global-client-fingerprint: chrome

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"
    - "alt1-mtalk.google.com"
    - "alt2-mtalk.google.com"
    - "alt3-mtalk.google.com"
    - "alt4-mtalk.google.com"
    - "alt5-mtalk.google.com"
    - "alt6-mtalk.google.com"
    - "alt7-mtalk.google.com"
    - "alt8-mtalk.google.com"
    - "mtalk-dev.google.com"
    - "mtalk-staging.google.com"
    - "mtalk.google.com"
    - "mtalk4.google.com"
  skip-dst-address:
    - 91.105.192.0/23
    - 91.108.4.0/22
    - 91.108.8.0/21
    - 91.108.16.0/21
    - 91.108.56.0/22
    - 95.161.64.0/20
    - 149.154.160.0/20
    - 185.76.151.0/24
    - 2001:67c:4e8::/48
    - 2001:b28:f23c::/47
    - 2001:b28:f23f::/48
    - 2a0a:f280:203::/48

profile:
  store-selected: true
  store-fake-ip: true

domesticNameservers: &domesticNameservers
  - https://223.5.5.5/dns-query
  - https://223.6.6.6/dns-query
foreignNameservers: &foreignNameservers
  - https://223.5.5.5/dns-query
  - https://223.6.6.6/dns-query
# Uncomment the following lines if you want to use foreign DNS servers and comment the above foreignNameservers.
# foreignNameservers: &foreignNameservers
#   - https://1.1.1.1/dns-query
#   - https://1.0.0.1/dns-query

