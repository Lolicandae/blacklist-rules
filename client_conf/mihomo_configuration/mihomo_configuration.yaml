groupBaseOption:
  &groupBaseOption {
    interval: 720,
    timeout: 3000,
  }
pr:
  &pr {
    <<: *groupBaseOption,
    proxies:
      [
        Proxy,
        All Nodes,
        Minimum delay,
        Fallback,
        Load Balancing (Hashing),
        Load Balancing (Round Robin),
        DIRECT,
      ],
  }
dr:
  &dr {
    <<: *groupBaseOption,
    proxies:
      [
        DIRECT,
        Proxy,
        All Nodes,
        Minimum delay,
        Fallback,
        Load Balancing (Hashing),
        Load Balancing (Round Robin),
      ],
  }

proxy-groups:
  - {
      <<: *groupBaseOption,
      url: "https://www.gstatic.com/generate_204",
      name: Proxy,
      type: select,
      proxies:
        [
          All Nodes,
          Minimum delay,
          HK Nodes,
          TW Nodes,
          JP Nodes,
          US Nodes,
          SG Nodes,
          UK Nodes,
          Fallback,
          Load Balancing (Hashing),
          Load Balancing (Round Robin),
        ],
    }
  - {
      <<: *groupBaseOption,
      url: "https://www.gstatic.com/generate_204",
      name: All Nodes,
      type: select,
      include-all: true,
    }
  - {
      <<: *groupBaseOption,
      url: "https://www.gstatic.com/generate_204",
      name: HK Nodes,
      type: select,
      include-all: true,
      filter: "(?i)港|hk|hongkong|hong kong",
    }
  - {
      <<: *groupBaseOption,
      url: "https://www.gstatic.com/generate_204",
      name: TW Nodes,
      type: select,
      include-all: true,
      filter: "(?i)台|tw|twn|taiwan",
    }
  - {
      <<: *groupBaseOption,
      url: "https://www.gstatic.com/generate_204",
      name: JP Nodes,
      type: select,
      include-all: true,
      filter: "(?i)日本|jp|japan",
    }
  - {
      <<: *groupBaseOption,
      url: "https://www.gstatic.com/generate_204",
      name: US Nodes,
      type: select,
      include-all: true,
      filter: "(?i)美国|us|unitedstates|united states",
    }
  - {
      <<: *groupBaseOption,
      url: "https://www.gstatic.com/generate_204",
      name: SG Nodes,
      type: select,
      include-all: true,
      filter: "(?i)新加坡|sg|Singapore",
    }
  - {
      <<: *groupBaseOption,
      url: "https://www.gstatic.com/generate_204",
      name: UK Nodes,
      type: select,
      include-all: true,
      filter: "(?i)英国|uk|gbr",
    }
  - {
      <<: *groupBaseOption,
      url: "https://www.gstatic.com/generate_204",
      name: Minimum delay,
      type: url-test,
      include-all: true,
      tolerance: 20,
      interval: 300,
      filter: "^((?!(直连)).)*$",
      exclude-filter: "剩余流量|remaining-traffic|套餐到期|plan-expired|提前用完买重置包|距离下次重置剩余|remaining-reset",
    }
  - {
      <<: *groupBaseOption,
      url: "https://www.gstatic.com/generate_204",
      name: Fallback,
      type: fallback,
      include-all: true,
      tolerance: 20,
      interval: 300,
      exclude-filter: "剩余流量|remaining-traffic|套餐到期|plan-expired|提前用完买重置包|距离下次重置剩余|remaining-reset",
    }
  - {
      <<: *groupBaseOption,
      url: "https://www.gstatic.com/generate_204",
      name: Load Balancing (Hashing),
      type: load-balance,
      strategy: consistent-hashing,
      include-all: true,
      exclude-filter: "剩余流量|remaining-traffic|套餐到期|plan-expired|提前用完买重置包|距离下次重置剩余|remaining-reset",
    }
  - {
      <<: *groupBaseOption,
      url: "https://www.gstatic.com/generate_204",
      name: Load Balancing (Round Robin),
      type: load-balance,
      strategy: round-robin,
      include-all: true,
      exclude-filter: "剩余流量|remaining-traffic|套餐到期|plan-expired|提前用完买重置包|距离下次重置剩余|remaining-reset",
    }
