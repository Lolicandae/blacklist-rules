[Proxy Group]
Proxy = select, All Nodes, Minimum delay, HK Nodes, TW Nodes, JP Nodes, US Nodes, SG Nodes, UK Nodes, Fallback, Load Balancing (Hashing), Load Balancing (Round Robin)
All Nodes = select, update-interval = 86400, policy-path = Your Subscription URL
HK Nodes = select, include-other-group = All Nodes, hidden = 0, include-all-proxies = 0, policy-regex-filter = (?i)港|hk|hongkong|hong kong
TW Nodes = select, include-other-group = All Nodes, hidden = 0, include-all-proxies = 0, policy-regex-filter = (?i)台|tw|twn|taiwan
JP Nodes = select, include-other-group = All Nodes, hidden = 0, include-all-proxies = 0, policy-regex-filter = (?i)日本|jp|japan
US Nodes = select, include-other-group = All Nodes, hidden = 0, include-all-proxies = 0, policy-regex-filter = (?i)美国|us|unitedstates|united states
SG Nodes = select, include-other-group = All Nodes, hidden = 0, include-all-proxies = 0, policy-regex-filter = (?i)新加坡|sg|Singapore
UK Nodes = select, include-other-group = All Nodes, hidden = 0, include-all-proxies = 0, policy-regex-filter = (?i)英国|uk|gbr
Minimum delay = url-test, include-other-group = All Nodes, hidden = 0, include-all-proxies = 0, policy-regex-filter = ^(((?!剩余流量|remaining-traffic|套餐到期|plan-expired|提前用完买重置包|距离下次重置剩余|remaining-reset).))*$
Fallback = fallback, include-other-group = All Nodes, hidden = 0, include-all-proxies = 0, tolerance = 20, interval = 300, policy-regex-filter = ^(((?!剩余流量|remaining-traffic|套餐到期|plan-expired|提前用完买重置包|距离下次重置剩余|remaining-reset).))*$
Load Balancing (Hashing) = load-balance, persistent = true, include-other-group = All Nodes, hidden = 0, include-all-proxies = 0, policy-regex-filter = ^(((?!剩余流量|remaining-traffic|套餐到期|plan-expired|提前用完买重置包|距离下次重置剩余|remaining-reset).))*$
Load Balancing (Round Robin) = load-balance, persistent = false, include-other-group = All Nodes, hidden = 0, include-all-proxies = 0, policy-regex-filter = ^(((?!剩余流量|remaining-traffic|套餐到期|plan-expired|提前用完买重置包|距离下次重置剩余|remaining-reset).))*$
