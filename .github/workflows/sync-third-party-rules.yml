name: Sync Third-Party Rules

on:
  schedule:
    # Daily at 03:23 Hong Kong / Beijing time (UTC+8), 19:23 UTC on the previous day.
    - cron: "23 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workflow_scripts/sync_third_party_rules.py"
      - "workflow_scripts/build_rules.py"
      - "workflow_scripts/publish_generated_rules.py"
      - "third_party/**"
      - "client_conf/**/*.yaml"
      - "client_conf/**/*.js"
      - "client_conf/**/*.conf"
      - ".github/workflows/sync-third-party-rules.yml"
  pull_request:
    paths:
      - "workflow_scripts/sync_third_party_rules.py"
      - "workflow_scripts/build_rules.py"
      - "workflow_scripts/publish_generated_rules.py"
      - ".github/workflows/sync-third-party-rules.yml"
      - "third_party/**"
      - "client_conf/**/*.yaml"
      - "client_conf/**/*.js"
      - "client_conf/**/*.conf"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Mihomo for native MRS validation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ai-agent-mihomo"
          curl -fsSL --retry 3 --max-time 180 -o "$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo.gz" https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-compatible-v1.19.32.gz
          echo "ba3ce607747a07f948fc35780e108a4a7c7f552a38b9bd4d115f313ebcb89c20  $RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo.gz" | sha256sum --check -
          gzip -dc "$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo.gz" > "$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo"
          chmod +x "$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo"
          echo "MIHOMO_BIN=$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo" >> "$GITHUB_ENV"
      - name: Check conversion and failure retention
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python workflow_scripts/sync_third_party_rules.py --self-test
      - name: Check actual repository rules and references
        run: python workflow_scripts/sync_third_party_rules.py --check

  sync:
    needs: validate
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: rules-publish-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Mihomo for native MRS validation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ai-agent-mihomo"
          curl -fsSL --retry 3 --max-time 180 -o "$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo.gz" https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-compatible-v1.19.32.gz
          echo "ba3ce607747a07f948fc35780e108a4a7c7f552a38b9bd4d115f313ebcb89c20  $RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo.gz" | sha256sum --check -
          gzip -dc "$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo.gz" > "$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo"
          chmod +x "$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo"
          echo "MIHOMO_BIN=$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo" >> "$GITHUB_ENV"
      - name: Sync, validate and publish latest rules
        run: python workflow_scripts/publish_generated_rules.py sync
